<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smartbox API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"/>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="config-bar">
      <label>Base URL
        <input
          id="base-url"
          value="http://10.191.15.192:30000/"
          style="width: 220px"
        />
      </label>
      
      <label>Username
        <input id="username" value="admin" style="width: 250px" />
      </label>
      
      <label>Password MD5
        <input
          id="password-md5"
          value="e10adc3949ba59abbe56e057f20f883e"
          style="width: 260px"
        />
      </label>
      
      <label>Token
        <input
          id="token"
          placeholder="Paste token or use Login endpoint"
          style="width: 300px"
        />
      </label>

      <button id="reload-spec">Refresh</button>
      <button class="secondary" id="clear-token">Clear Token</button>
      <span id="status-line">Ready</span>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" crossorigin></script>
    <script type="module" src="smartbox-api-tester.js"></script>
  </body>
</html>
