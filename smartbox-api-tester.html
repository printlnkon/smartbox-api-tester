<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smartbox — API Tester</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap");

      :root {
        --bg: #0d0f12;
        --surface: #141720;
        --surface2: #1c2030;
        --surface3: #242840;
        --border: rgba(255, 255, 255, 0.07);
        --border2: rgba(255, 255, 255, 0.13);
        --text: #e8eaf0;
        --muted: #6b7280;
        --accent: #4f8aff;
        --accent-dim: rgba(79, 138, 255, 0.12);
        --green: #34d399;
        --green-dim: rgba(52, 211, 153, 0.12);
        --amber: #fbbf24;
        --amber-dim: rgba(251, 191, 36, 0.12);
        --red: #f87171;
        --red-dim: rgba(248, 113, 113, 0.12);
        --purple: #a78bfa;
        --purple-dim: rgba(167, 139, 250, 0.12);
        --mono: "IBM Plex Mono", monospace;
        --sans: "IBM Plex Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Header ── */
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border2);
        padding: 0 24px;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .logo {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
        letter-spacing: 0.04em;
      }
      .logo span {
        color: var(--muted);
      }
      header .spacer {
        flex: 1;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        transition: background 0.3s;
      }
      .status-dot.ok {
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
      }
      .status-dot.err {
        background: var(--red);
        box-shadow: 0 0 6px var(--red);
      }
      .status-label {
        font-size: 12px;
        color: var(--muted);
        font-family: var(--mono);
      }

      /* ── Layout ── */
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Sidebar ── */
      aside {
        width: 260px;
        min-width: 260px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .cfg-panel {
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .cfg-panel h3 {
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        font-size: 11px;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
      }
      .field input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        font-family: var(--mono);
        color: var(--text);
        outline: none;
        transition: border-color 0.15s;
      }
      .field input:focus {
        border-color: var(--accent);
      }
      .field input.has-value {
        border-color: rgba(79, 138, 255, 0.4);
      }

      .token-row {
        display: flex;
        gap: 6px;
      }
      .token-row input {
        flex: 1;
        min-width: 0;
      }
      .btn-sm {
        background: var(--surface3);
        border: 1px solid var(--border2);
        border-radius: 6px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--mono);
        padding: 0 10px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
      }
      .btn-sm:hover {
        background: var(--surface3);
        border-color: var(--accent);
        color: var(--accent);
      }
      .md5-hint {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
        font-family: var(--mono);
      }

      /* ── Nav groups ── */
      nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .nav-group-label {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 12px 16px 4px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px;
        cursor: pointer;
        transition: background 0.12s;
        border-left: 2px solid transparent;
      }
      .nav-item:hover {
        background: var(--surface2);
      }
      .nav-item.active {
        background: var(--accent-dim);
        border-left-color: var(--accent);
      }
      .nav-item .nbadge {
        font-size: 9px;
        font-weight: 600;
        padding: 1px 5px;
        border-radius: 3px;
        font-family: var(--mono);
        min-width: 36px;
        text-align: center;
      }
      .nav-item .ntitle {
        font-size: 12px;
        line-height: 1.3;
      }

      /* ── Main panel ── */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .panel-top {
        padding: 20px 24px 0;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
      }
      .ep-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      .method-badge {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 5px;
        letter-spacing: 0.04em;
      }
      .ep-title-main {
        font-size: 18px;
        font-weight: 500;
      }
      .ep-path-main {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .ep-desc {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }

      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        gap: 20px;
      }

      .col-left {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .col-right {
        width: 400px;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .card-head {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-head h4 {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card-body {
        padding: 14px;
      }

      /* ── Request body editor ── */
      .body-editor {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 12px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
        resize: vertical;
        min-height: 160px;
        outline: none;
        line-height: 1.7;
        transition: border-color 0.15s;
      }
      .body-editor:focus {
        border-color: var(--accent);
      }

      /* ── Params table ── */
      .params-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .params-table th {
        text-align: left;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0 8px 8px 0;
        font-weight: 500;
      }
      .params-table td {
        padding: 5px 8px 5px 0;
        vertical-align: top;
      }
      .params-table td:first-child {
        font-family: var(--mono);
        color: var(--accent);
        white-space: nowrap;
      }
      .params-table td:nth-child(2) {
        color: var(--amber);
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 11px;
      }
      .req-tag {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 3px;
        font-family: var(--mono);
      }
      .req-yes {
        background: rgba(248, 113, 113, 0.15);
        color: var(--red);
      }
      .req-no {
        background: rgba(107, 114, 128, 0.15);
        color: var(--muted);
      }
      .param-desc {
        color: var(--muted);
        line-height: 1.5;
      }

      /* ── Action row ── */
      .action-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn-run {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 7px;
        padding: 9px 20px;
        font-size: 13px;
        font-family: var(--sans);
        font-weight: 500;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.1s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-run:hover {
        opacity: 0.9;
      }
      .btn-run:active {
        transform: scale(0.98);
      }
      .btn-run.loading {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .btn-copy-curl {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 7px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--mono);
        padding: 9px 14px;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .btn-copy-curl:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ── Response ── */
      .response-meta {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .res-status {
        font-family: var(--mono);
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 4px;
      }
      .res-time {
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
      }
      .res-body {
        background: var(--surface2);
        border-radius: 6px;
        padding: 12px;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.7;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 400px;
        overflow-y: auto;
        min-height: 80px;
        color: var(--muted);
      }

      /* JSON syntax highlight */
      .json-key {
        color: #7dd3fc;
      }
      .json-str {
        color: #86efac;
      }
      .json-num {
        color: #fca5a5;
      }
      .json-bool {
        color: var(--purple);
      }
      .json-null {
        color: var(--muted);
      }

      /* ── curl output ── */
      .curl-out {
        background: var(--surface2);
        border-radius: 6px;
        padding: 12px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.7;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
        color: #94a3b8;
      }

      /* ── Method colors ── */
      .m-GET {
        background: rgba(52, 211, 153, 0.15);
        color: var(--green);
      }
      .m-POST {
        background: rgba(79, 138, 255, 0.15);
        color: var(--accent);
      }
      .m-PUT {
        background: rgba(251, 191, 36, 0.15);
        color: var(--amber);
      }
      .m-DELETE {
        background: rgba(248, 113, 113, 0.15);
        color: var(--red);
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface3);
        border-radius: 99px;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted);
        gap: 10px;
      }
      .empty-state .big {
        font-size: 36px;
      }
      .empty-state p {
        font-size: 13px;
      }

      .notice {
        font-size: 11px;
        color: var(--amber);
        background: var(--amber-dim);
        border: 1px solid rgba(251, 191, 36, 0.2);
        border-radius: 6px;
        padding: 8px 12px;
        font-family: var(--mono);
        line-height: 1.6;
      }

      @media (max-width: 900px) {
        .panel-body {
          flex-direction: column;
        }
        .col-right {
          width: 100%;
        }
        aside {
          width: 220px;
          min-width: 220px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        SMARTBOX <span>-</span>
        <span style="color: var(--muted); margin-left: 4px">API Tester</span>
      </div>
      <div class="spacer"></div>
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">Not Connected</span>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <aside>
        <div class="cfg-panel">
          <h3>Device Config</h3>
          <div class="field">
            <label>Base URL</label>
            <!-- local development -->
            <!-- <input
              id="cfg-base"
              value="http://192.168.1.100"
              oninput="refresh()"
            /> -->
            <!-- deployed in Zerotier -->
            <input
              id="cfg-base"
              value="http://10.191.15.192:30000/"
              oninput="refresh()"
            />
          </div>
          <div class="field">
            <label>Username</label>
            <input id="cfg-user" value="admin" oninput="refresh()" />
          </div>
          <div class="field">
            <label>Password MD5</label>
            <input
              id="cfg-pwd"
              value="e10adc3949ba59abbe56e057f20f883e"
              oninput="refresh()"
            />
            <div class="md5-hint">echo -n "pass" | md5sum</div>
          </div>
          <div class="field">
            <label>Token</label>
            <div class="token-row">
              <input
                id="cfg-tok"
                placeholder="Auto-filled on login"
                oninput="refresh()"
              />
              <button class="btn-sm" onclick="clearToken()">✕</button>
            </div>
          </div>
        </div>
        <nav id="nav"></nav>
      </aside>

      <!-- Main -->
      <main id="main">
        <div class="empty-state" id="empty">
          <div class="big">⌨</div>
          <p>Select an endpoint from the sidebar</p>
        </div>
        <div
          id="ep-view"
          style="
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
          "
        ></div>
      </main>
    </div>

    <script>
      const ENDPOINTS = [
        {
          group: "Auth",
          method: "POST",
          title: "Login",
          path: "/api/v1/user/login",
          description:
            "Obtain a session token. Password must be MD5-hashed. Token is valid for the duration returned in expires (seconds).",
          params: [
            {
              name: "name",
              type: "String",
              required: true,
              description: "Login username",
            },
            {
              name: "pwd",
              type: "String",
              required: true,
              description: "MD5-encrypted password",
            },
          ],
          body: () =>
            JSON.stringify(
              { name: getConfig().username, pwd: getConfig().passwordMd5 },
              null,
              2,
            ),
          afterRun: (res) => {
            try {
              const t = JSON.parse(res).data?.token;
              if (t) {
                document.getElementById("cfg-tok").value = t;
                refresh();
                setStatus("ok", "Connected");
              }
            } catch (e) {}
          },
        },
        {
          group: "Auth",
          method: "POST",
          title: "Logout",
          path: "/api/v1/user/logout",
          params: [
            {
              name: "name",
              type: "String",
              required: true,
              description: "Username",
            },
            {
              name: "token",
              type: "String",
              required: true,
              description: "Token to invalidate",
            },
          ],
          body: () =>
            JSON.stringify(
              { name: getConfig().username, token: getConfig().token },
              null,
              2,
            ),
          afterRun: () => {
            document.getElementById("cfg-tok").value = "";
            refresh();
            setStatus("", "Not Connected");
          },
        },
        {
          group: "Auth",
          method: "GET",
          title: "Update token",
          path: "/api/v1/user/update_token",
          description: "Refreshes the current token validity period.",
          params: [],
          body: () => null,
        },

        {
          group: "Person library",
          method: "POST",
          title: "Add person library",
          path: "/api/v1/smart/personlib/",
          description:
            "Create a new person library. lib_type 1=Blocklist, 2=Allowlist.",
          params: [
            {
              name: "lib_title",
              type: "String",
              required: true,
              description: "Library name. Max 64 bytes.",
            },
            {
              name: "lib_type",
              type: "Int",
              required: true,
              description: "1: Blocklist  2: Allowlist",
            },
          ],
          body: () =>
            JSON.stringify({ lib_title: "My Library", lib_type: 1 }, null, 2),
        },
        {
          group: "Person library",
          method: "GET",
          title: "Query person libraries",
          path: "/api/v1/smart/personlib/",
          params: [],
          body: () => null,
        },
        {
          group: "Person library",
          method: "PUT",
          title: "Modify person library",
          path: "/api/v1/smart/personlib/{lib_id}",
          description:
            "Rename a library. Replace {lib_id} in the path with the actual ID.",
          params: [
            {
              name: "lib_title",
              type: "String",
              required: true,
              description: "New library name.",
            },
          ],
          body: () => JSON.stringify({ lib_title: "Renamed Library" }, null, 2),
        },
        {
          group: "Person library",
          method: "DELETE",
          title: "Delete person library",
          path: "/api/v1/smart/personlib/{lib_id}",
          description:
            "Permanently deletes a library and all its members. Replace {lib_id} in the path.",
          params: [],
          body: () => null,
        },

        {
          group: "Person info",
          method: "POST",
          title: "Add person info",
          path: "/api/v1/smart/personlib/{lib_id}/members",
          description:
            "Add a face to a person library. photo_base64 is required — generate with: base64 -w 0 face.jpg",
          params: [
            {
              name: "name",
              type: "String",
              required: true,
              description: "Person name. Max 255 bytes.",
            },
            {
              name: "photo_base64",
              type: "String",
              required: true,
              description: "Base64-encoded JPEG face photo.",
            },
            {
              name: "sex",
              type: "Int",
              required: false,
              description: "0=Unknown 1=Male 2=Female 9=Unspecified",
            },
            {
              name: "email",
              type: "String",
              required: false,
              description: "Email address.",
            },
            {
              name: "tel",
              type: "String",
              required: false,
              description: "Phone number.",
            },
            {
              name: "certificate_type",
              type: "Int",
              required: false,
              description: "0=ID card 2=Passport 3=Driver's license 99=Others",
            },
            {
              name: "certificate_no",
              type: "String",
              required: false,
              description: "ID number.",
            },
            {
              name: "birth_date",
              type: "String",
              required: false,
              description: "Birth date.",
            },
          ],
          body: () =>
            JSON.stringify(
              {
                name: "John Doe",
                sex: 1,
                email: "",
                tel: "",
                certificate_type: 99,
                certificate_no: "",
                birth_date: "",
                photo_base64: "<BASE64_JPEG>",
              },
              null,
              2,
            ),
        },
        {
          group: "Person info",
          method: "PUT",
          title: "Modify person info",
          path: "/api/v1/smart/personlib/{lib_id}/members",
          params: [
            {
              name: "face_id",
              type: "Int",
              required: true,
              description: "Face ID (from add/query response).",
            },
            {
              name: "name",
              type: "String",
              required: false,
              description: "Updated name.",
            },
            {
              name: "photo_base64",
              type: "String",
              required: false,
              description: "Updated face photo.",
            },
          ],
          body: () =>
            JSON.stringify({ face_id: 1, name: "Jane Doe", sex: 2 }, null, 2),
        },
        {
          group: "Person info",
          method: "DELETE",
          title: "Delete person info",
          path: "/api/v1/smart/personlib/members",
          params: [
            {
              name: "lib_id",
              type: "Int",
              required: true,
              description: "Person library ID.",
            },
            {
              name: "face_id_list",
              type: "Int[]",
              required: true,
              description: "Array of face IDs to delete.",
            },
          ],
          body: () =>
            JSON.stringify({ lib_id: 1, face_id_list: [1, 2] }, null, 2),
        },
        {
          group: "Person info",
          method: "POST",
          title: "Query person info",
          path: "/api/v1/smart/personlib/{lib_id}/members_list",
          params: [
            {
              name: "page",
              type: "Int",
              required: false,
              description: "Page number. Default: 1.",
            },
            {
              name: "size",
              type: "Int",
              required: false,
              description: "Per page. Default/max: 100.",
            },
            {
              name: "member_name",
              type: "String",
              required: false,
              description: "Filter by name.",
            },
          ],

      let activeEndpointIndex = null;
      const pathParamValues = {};

      function getConfig() {
        return {
          baseUrl: document.getElementById("cfg-base").value.replace(/\/$/, ""),
          username: document.getElementById("cfg-user").value,
          passwordMd5: document.getElementById("cfg-pwd").value,
          token: document.getElementById("cfg-tok").value || "YOUR_TOKEN",
        };
      }

      function refresh() {
        if (activeEndpointIndex !== null) renderEp(activeEndpointIndex);
      }
      function clearToken() {
        document.getElementById("cfg-tok").value = "";
        refresh();
      }
      function setStatus(cls, label) {
        const statusDot = document.getElementById("status-dot");
        statusDot.className = "status-dot " + (cls || "");
        document.getElementById("status-label").textContent = label;
      }

      function getPathParamNames(pathTemplate) {
        return Array.from(pathTemplate.matchAll(/\{([^}]+)\}/g)).map(
          (match) => match[1],
        );
      }

      function getPathParamValue(endpointIndex, paramName) {
        return pathParamValues[endpointIndex]?.[paramName] ?? "";
      }

      function setPathParamValue(endpointIndex, paramName, value) {
        if (!pathParamValues[endpointIndex]) {
          pathParamValues[endpointIndex] = {};
        }
        pathParamValues[endpointIndex][paramName] = value;
        updateCurl(endpointIndex);
      }

      function getResolvedPath(pathTemplate, endpointIndex) {
        const values = pathParamValues[endpointIndex] || {};
        return pathTemplate.replace(/\{([^}]+)\}/g, (match, paramName) => {
          const value = values[paramName];
          return value ? encodeURIComponent(value) : match;
        });
      }

      function buildNav() {
        const nav = document.getElementById("nav");
        const groups = {};
        ENDPOINTS.forEach((endpoint, endpointIndex) => {
          if (!groups[endpoint.group]) groups[endpoint.group] = [];
          groups[endpoint.group].push({ endpoint, endpointIndex });
        });
        Object.entries(groups).forEach(([groupName, groupEndpoints]) => {
          const label = document.createElement("div");
          label.className = "nav-group-label";
          label.textContent = groupName;
          nav.appendChild(label);
          groupEndpoints.forEach(({ endpoint, endpointIndex }) => {
            const item = document.createElement("div");
            item.className = "nav-item";
            item.id = "nav-" + endpointIndex;
            item.innerHTML = `<span class="nbadge m-${endpoint.method}">${endpoint.method}</span><span class="ntitle">${endpoint.title}</span>`;
            item.onclick = () => selectEp(endpointIndex);
            nav.appendChild(item);
          });
        });
      }

      function selectEp(endpointIndex) {
        if (activeEndpointIndex !== null) {
          const previous = document.getElementById(
            "nav-" + activeEndpointIndex,
          );
          if (previous) previous.classList.remove("active");
        }
        activeEndpointIndex = endpointIndex;
        document.getElementById("nav-" + endpointIndex).classList.add("active");
        document.getElementById("empty").style.display = "none";
        const endpointView = document.getElementById("ep-view");
        endpointView.style.display = "flex";
        renderEp(endpointIndex);
      }

      function renderEp(endpointIndex) {
        const endpoint = ENDPOINTS[endpointIndex];
        const config = getConfig();
        const hasRequestBody = endpoint.body() !== null;
        const isTokenMissing = config.token === "YOUR_TOKEN";
        const pathParamNames = getPathParamNames(endpoint.path);
        const pathParamInputs = pathParamNames
          .map((paramName) => {
            const value = getPathParamValue(endpointIndex, paramName);
            return `<div class="field">
              <label>${paramName}</label>
              <input
                class="path-param-input"
                value="${escAttr(value)}"
                placeholder="{${paramName}}"
                oninput="setPathParamValue(${endpointIndex}, '${paramName}', this.value)"
              />
            </div>`;
          })
          .join("");
        const resolvedPath = getResolvedPath(endpoint.path, endpointIndex);

        const curlCommand = buildCurl(endpoint, config, endpointIndex);

        document.getElementById("ep-view").innerHTML = `
    <div class="panel-top">
      <div class="ep-header">
        <span class="method-badge m-${endpoint.method}">${endpoint.method}</span>
        <span class="ep-title-main">${endpoint.title}</span>
      </div>
      <div class="ep-path-main">${config.baseUrl}${resolvedPath}</div>
      ${endpoint.description ? `<div class="ep-desc">${endpoint.description}</div>` : ""}
    </div>
    <div class="panel-body">
      <div class="col-left">
        ${isTokenMissing && endpoint.title !== "Login" ? `<div class="notice">⚠ No token set — run Login first to get a token, or paste one in the config panel.</div>` : ""}
        ${endpoint.isUpload ? `<div class="card"><div class="card-head"><h4>Note</h4></div><div class="card-body"><div class="ep-desc">File upload requires curl or a tool like Postman. Use the curl command on the right.</div></div></div>` : ""}
        ${pathParamInputs ? `<div class="card"><div class="card-head"><h4>Path params</h4></div><div class="card-body">${pathParamInputs}</div></div>` : ""}
        ${
          hasRequestBody
            ? `
        <div class="card">
          <div class="card-head">
            <h4>Request body</h4>
            <button class="btn-sm" onclick="resetBody(${endpointIndex})">Reset</button>
          </div>
          <div class="card-body">
            <textarea class="body-editor" id="body-editor" spellcheck="false">${endpoint.body()}</textarea>
          </div>
        </div>`
            : ""
        }
        <div class="action-row">
          <button class="btn-run" id="btn-run" onclick="runReq(${endpointIndex})">
            <span id="run-icon">▶</span> Send request
          </button>
          <button class="btn-copy-curl" onclick="copyCurl(this)">Copy curl</button>
        </div>
        <div class="card" id="res-card" style="display:none">
          <div class="card-head">
            <h4>Response</h4>
            <div class="response-meta">
              <span class="res-status" id="res-status"></span>
              <span class="res-time" id="res-time"></span>
            </div>
          </div>
          <div class="card-body">
            <div class="res-body" id="res-body">—</div>
          </div>
        </div>
      </div>
      <div class="col-right">
        ${
          endpoint.params.length
            ? `
        <div class="card">
          <div class="card-head"><h4>Parameters</h4></div>
          <div class="card-body">
            <table class="params-table">
              <thead><tr><th>Name</th><th>Type</th><th>Req</th><th>Description</th></tr></thead>
              <tbody>
                ${endpoint.params
                  .map(
                    (param) => `<tr>
                  <td>${param.name}</td>
                  <td>${param.type}</td>
                  <td><span class="req-tag ${param.required ? "req-yes" : "req-no"}">${param.required ? "Yes" : "No"}</span></td>
                  <td class="param-desc">${param.description}</td>
                </tr>`,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        </div>`
            : ""
        }
        <div class="card">
          <div class="card-head">
            <h4>curl equivalent</h4>
            <button class="btn-sm" onclick="copyCurl(this)">Copy</button>
          </div>
          <div class="card-body">
            <div class="curl-out" id="curl-out">${escHtml(curlCommand)}</div>
          </div>
        </div>
      </div>
    </div>`;

        document
          .getElementById("body-editor")
          ?.addEventListener("input", () => updateCurl(endpointIndex));
        window._curlCommand = curlCommand;
      }

      function updateCurl(endpointIndex) {
        const endpoint = ENDPOINTS[endpointIndex];
        const config = getConfig();
        const curlCommand = buildCurl(endpoint, config, endpointIndex);
        const curlOutput = document.getElementById("curl-out");
        if (curlOutput) curlOutput.textContent = curlCommand;
        window._curlCommand = curlCommand;
      }

      function buildCurl(endpoint, config, endpointIndex) {
        const bodyRaw =
          document.getElementById("body-editor")?.value ?? endpoint.body();
        const hasRequestBody = bodyRaw !== null;
        const resolvedPath = getResolvedPath(endpoint.path, endpointIndex);
        const method = endpoint.isUpload ? "POST" : endpoint.method;
        let curlCommand = `curl -s -X ${method} "${config.baseUrl}${resolvedPath}"`;
        if (
          (endpoint.method !== "GET" && endpoint.method !== "DELETE") ||
          hasRequestBody
        )
          curlCommand += ` \\\n+  -H "Content-Type: application/json"`;
        if (endpoint.path !== "/api/v1/user/login")
          curlCommand += ` \\\n+  -H "Authorization: ${config.token}"`;
        if (endpoint.isUpload)
          curlCommand =
            curlCommand.replace("application/json", "multipart/form-data") +
            ` \\\n+  -F "file=@/path/to/firmware.tar.gz"`;
        else if (hasRequestBody && bodyRaw)
          curlCommand += ` \\\n+  -d '${bodyRaw.replace(/\n/g, "").replace(/\s{2,}/g, " ")}'`;
        return curlCommand;
      }

      async function runReq(endpointIndex) {
        const endpoint = ENDPOINTS[endpointIndex];
        const config = getConfig();
        const resolvedPath = getResolvedPath(endpoint.path, endpointIndex);
        if (endpoint.isUpload) {
          alert(
            "File upload is not supported in the browser — use the curl command instead.",
          );
          return;
        }
        const runButton = document.getElementById("btn-run");
        runButton.classList.add("loading");
        runButton.innerHTML = "<span>⏳</span> Sending…";
        const bodyRaw = document.getElementById("body-editor")?.value ?? null;
        const startTime = performance.now();
        try {
          const fetchOptions = {
            method: endpoint.method,
            headers: { "Content-Type": "application/json" },
          };
          if (endpoint.path !== "/api/v1/user/login")
            fetchOptions.headers["Authorization"] = config.token;
          if (bodyRaw && endpoint.method !== "GET") fetchOptions.body = bodyRaw;
          const response = await fetch(
            config.baseUrl + resolvedPath,
            fetchOptions,
          );
          const elapsedMs = Math.round(performance.now() - startTime);
          const responseText = await response.text();
          showRes(response.status, elapsedMs, responseText);
          if (endpoint.afterRun) endpoint.afterRun(responseText);
          if (response.ok) setStatus("ok", "Connected");
          else setStatus("err", `error ${response.status}`);
        } catch (err) {
          const elapsedMs = Math.round(performance.now() - startTime);
          showRes(
            0,
            elapsedMs,
            "Network error: " +
              err.message +
              "\n\nMake sure the device IP is reachable and CORS is not blocked.\nIf CORS is blocked, use the curl command in a terminal instead.",
          );
          setStatus("err", "Unreachable");
        }
        runButton.classList.remove("loading");
        runButton.innerHTML = "<span>▶</span> Send request";
      }

      function showRes(statusCode, elapsedMs, responseText) {
        const responseCard = document.getElementById("res-card");
        responseCard.style.display = "";
        const statusBadge = document.getElementById("res-status");
        const isSuccess = statusCode >= 200 && statusCode < 300;
        statusBadge.textContent = statusCode || "ERR";
        statusBadge.className =
          "res-status " +
          (statusCode === 0 ? "m-DELETE" : isSuccess ? "m-GET" : "m-DELETE");
        document.getElementById("res-time").textContent = elapsedMs + "ms";
        try {
          document.getElementById("res-body").innerHTML = syntaxHighlight(
            JSON.stringify(JSON.parse(responseText), null, 2),
          );
        } catch (err) {
          document.getElementById("res-body").textContent = responseText;
        }
      }

      function syntaxHighlight(jsonText) {
        return jsonText
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(
            /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
            (match) => {
              let cls = "json-num";
              if (/^"/.test(match)) {
                cls = /:$/.test(match) ? "json-key" : "json-str";
              } else if (/true|false/.test(match)) cls = "json-bool";
              else if (/null/.test(match)) cls = "json-null";
              return `<span class="${cls}">${match}</span>`;
            },
          );
      }

      function resetBody(endpointIndex) {
        const editor = document.getElementById("body-editor");
        if (editor) {
          editor.value = ENDPOINTS[endpointIndex].body() || "";
          updateCurl(endpointIndex);
        }
      }
      function copyCurl(buttonEl) {
        const text = window._curlCommand || "";
        if (!text) return;
        copyTextToClipboard(text)
          .then(() => {
            const button = buttonEl || document.querySelector(".btn-copy-curl");
            if (!button) return;
            const original = button.textContent || "Copy";
            button.textContent = "Copied!";
            setTimeout(() => (button.textContent = original), 1500);
          })
          .catch(() => {
            alert(
              "Clipboard access failed. Copy the curl command manually from the panel.",
            );
          });
      }

      function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise((resolve, reject) => {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          textarea.style.top = "0";
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(textarea);
          if (ok) resolve();
          else reject(new Error("copy failed"));
        });
      }
      function escHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function escAttr(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      buildNav();
    </script>
  </body>
</html>
