<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smartbox OpenAPI Testing Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"/>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="config-bar">

      <!-- Row 1: branding + status -->
      <div class="config-bar-top">
        <div class="config-bar-brand">
          <div class="brand-dot"></div>
          <span id="status-line">Ready</span>
        </div>
      </div>

      <!-- Row 2: inputs + actions -->
      <div class="config-bar-main">
        <div class="config-bar-inputs">
          <label>Base URL
            <input id="base-url" value="http://10.191.15.192:30000/" />
          </label>
          <label>Username
            <input id="username" value="admin" style="width: 120px" />
          </label>
          <label>Password MD5
            <input id="password-md5" value="e10adc3949ba59abbe56e057f20f883e" />
          </label> 
          <label>Token
            <input id="token" placeholder="Paste token or use Login endpoint" />
          </label>
        </div>

        <div class="config-bar-actions">
          <label>Jump to
            <select id="group-jump">
              <option value="">Select group…</option>
            </select>
          </label>
          <button id="reload-spec">Refresh</button>
          <button id="clear-token">Clear Token</button>
        </div>
      </div>

    </div>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" crossorigin></script>
    <script type="module" src="smartbox-api-tester.js"></script>
  </body>
</html>
